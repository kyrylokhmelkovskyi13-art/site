name: Validate BotControl

on:
  push:
    branches:
      - botcontrol-v2-guild-settings
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - name: Check inline browser scripts
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach(([_, source], index) => fs.writeFileSync('/tmp/botcontrol-inline-' + index + '.js', source));
          console.log('Extracted ' + scripts.length + ' inline script(s)');
          NODE
          for file in /tmp/botcontrol-inline-*.js; do node --check "$file"; done
